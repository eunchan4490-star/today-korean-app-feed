name: Update recent service introductions
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
permissions:
  contents: write
concurrency:
  group: app-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s feed -p 'test_services.py'
      - run: python3 feed/services.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services.json
          if ! git diff --cached --quiet; then git commit -m 'Update recent service introductions'; git push; fi
